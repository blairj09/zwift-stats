[package]
name = "zwift-hub"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
duckdb = { version = "1.10506.1", features = ["bundled"] }
fitparser = "0.11.0"
hex = "0.4.3"
mime_guess = "2.0.5"
notify = "8.2.0"
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rust-embed = "8.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.0", features = ["full"] }
